name: Terraform Azure - Aula 10

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Validar e aplicar infraestrutura
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Autenticar na Azure
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Inicializar Terraform
        run: terraform init

      - name: Verificar formatação
        run: terraform fmt -check -recursive

      - name: Validar configuração
        run: terraform validate

      - name: Importar grupo existente
        shell: bash
        run: |
          if az group show \
            --name rg-terraform-aula10 \
            --output none 2>/dev/null; then

            terraform import \
              azurerm_resource_group.main \
              "/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/rg-terraform-aula10"
          fi

      - name: Planejar infraestrutura
        run: terraform plan -input=false -out=tfplan

      - name: Aplicar infraestrutura
        run: terraform apply -input=false -auto-approve tfplan
